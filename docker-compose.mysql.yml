services:
  mysql:
    image: mysql:8.4
    container_name: academy-autismo-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academy_autismo
      MYSQL_USER: academy
      MYSQL_PASSWORD: academy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
